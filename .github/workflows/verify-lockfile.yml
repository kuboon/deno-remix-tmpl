# Fails when .github/workflows/actions.lock is out of sync with the workflows, or when a locked pin
# no longer verifies upstream. Does nothing until the lockfile exists (`gh actions-lock` creates it;
# see TEMPLATE.md).
name: verify-lockfile

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Verify the lockfile
        run: |
          if [ ! -f .github/workflows/actions.lock ]; then
            echo "No .github/workflows/actions.lock yet; run \`gh actions-lock\` to create it."
            exit 0
          fi
          gh extension install github/gh-actions-lock --pin v0.2.0
          gh actions-lock --verify
